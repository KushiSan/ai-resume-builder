name: Render Fiber Spinning Video

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System & Graphics Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install manim

    - name: Render All Animation Scenes
      run: |
        manim -ql --disable_caching fiber_spinning.py Scene1Intro Scene2MeltSpinning Scene3SolutionOverview Scene4WetSpinning Scene5DrySpinning Scene6DryJetWetSpinning Scene7ComparativeSummary

    - name: Combine Scenes into Single Full Video
      run: |
        # Find all generated mp4 clips and merge them in sequence
        find media/ -name "*.mp4" | sort > concat_list.txt
        sed -i "s/^/file '/;s/$/'/" concat_list.txt
        ffmpeg -f concat -safe 0 -i concat_list.txt -c copy final_fiber_spinning_animation.mp4

    - name: Upload Final Combined Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: final-fiber-spinning-animation
        path: final_fiber_spinning_animation.mp4
      
