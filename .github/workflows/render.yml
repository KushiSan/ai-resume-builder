name: Render Fiber Spinning Video

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System & Graphics Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install manim

    - name: Render Animation Scene
      run: |
        manim -ql --disable_caching fiber_spinning.py Scene2MeltSpinning

    - name: Upload Rendered Video
      uses: actions/upload-artifact@v4
      with:
        name: melt-spinning-video
        path: media/videos/fiber_spinning/480p15/Scene2MeltSpinning.mp4
